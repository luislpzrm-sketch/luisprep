<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#080808;font-family:'Arial Narrow',Arial,sans-serif;color:#f0f0f0}
body{max-width:480px;margin:0 auto;display:flex;flex-direction:column}
input,textarea{outline:none;font-family:inherit}
::-webkit-scrollbar{display:none}
#app{flex:1;overflow-y:auto;padding:14px;padding-bottom:84px;background:#080808}
#header{background:#111;border-bottom:2px solid #facc15;padding:12px 16px 10px}

.nb{flex:1;background:none;border:none;padding:10px 0 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
.ni{font-size:19px}
.nl{font-size:9px;color:#444;font-weight:400}
.nd{width:18px;height:2px;background:#facc15;border-radius:1px;opacity:0;margin-top:1px}
.nb.on .nl{color:#facc15;font-weight:700}

.lbl{font-size:10px;color:#444;letter-spacing:2px;margin-bottom:4px}
.ifield{width:100%;background:#111;border:1px solid #222;border-radius:8px;color:#f0f0f0;padding:10px 12px;font-size:14px;font-family:inherit}
.card{background:#111;border:1px solid #1e1e1e;border-radius:10px;padding:12px 14px;margin-bottom:8px}
.tag{font-size:10px;background:#1a1a1a;padding:2px 6px;border-radius:4px;color:#666}

.pgfill{height:100%;border-radius:4px}
.mcard{background:#111;border:1px solid #222;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.mcard.done{background:#0a1a0a;border-color:#166534;opacity:.75}

.mchk.ok{background:#22c55e;border-color:#22c55e;color:#000}

.excard.on{border-color:#4ade80}

.exbody{padding:0 14px 12px;border-top:1px solid #1a1a1a}

#tov.danger{background:#7f1d1d;border-color:#ef4444}
.tipcard{background:#0f1400;border:1px solid #facc1533;border-radius:8px;padding:10px 12px;margin-top:12px;font-size:12px;color:#888;line-height:1.6;display:flex;gap:8px}
.hist{background:#111;border:1px solid #1a1a1a;border-radius:8px;padding:10px 12px;margin-bottom:6px}
.objcard{background:#111;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.shopitem{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#111;border:1px solid #1a1a1a;border-radius:10px;margin-bottom:6px;cursor:pointer}
.shopitem.got{background:#0a1a0a;border-color:#166534;opacity:.7}

.shopchk.ok{background:#22c55e;border-color:#22c55e;color:#000}
.shopsec{font-size:10px;color:#facc15;letter-spacing:2px;margin:14px 0 6px;border-bottom:1px solid #1a1a1a;padding-bottom:4px}
.photocard{background:#111;border:1px solid #1a1a1a;border-radius:10px;margin-bottom:10px;overflow:hidden}
.photocard img{width:100%;max-height:220px;object-fit:cover;display:block}
.phototab{display:flex;gap:0;margin-bottom:14px}

.ptab.on{background:#facc15;color:#000;border-color:#facc15}
.refimg{width:100%;height:180px;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px}
.refgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.refcard{background:#111;border-radius:8px;padding:10px}

function calcBF(p,ax,tri,sub,a,si,t){
  // Jackson-Pollock 7 pliegues hombres (edad 39)
  var vals=[p,ax,tri,sub,a,si,t].map(parseFloat);
  if(vals.some(function(v){return isNaN(v)||v<=0}))return null;
  var sum=vals.reduce(function(s,v){return s+v},0);
  var d=1.112-(0.00043499*sum)+(0.00000055*sum*sum)-(0.00028826*39);
  return (495/d-450).toFixed(1);
}
function calcBF3(p,a,t){
  // Jackson-Pollock 3 pliegues (fallback si no hay todos)
  if(!p||!a||!t)return null;
  var sum=parseFloat(p)+parseFloat(a)+parseFloat(t);
  var d=1.10938-0.0008267*sum+0.0000016*sum*sum-0.0002574*39;
  return (495/d-450).toFixed(1);
}

  h+='</div>';
  h+='<div class="lbl">NOTAS</div>';
  h+='<textarea class="ifield" id="cin" rows="3" placeholder="Sensaciones, entrenamiento..." style="resize:none"></textarea>';
  h+='</div>';
  h+='<button class="sbtn" id="cisb" onclick="svCI()">GUARDAR CHECK-IN</button>';
  if(checkins.length>0){
    h+='<div class="lbl">HISTORIAL</div>';
    var rev=[].concat(checkins).reverse().slice(0,5);
    rev.forEach(function(c,i){
      h+='<div class="hist"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:12px;color:#facc15;font-weight:700">'+c.date+'</span>'+(i===0?'<span style="font-size:9px;color:#facc15;background:#facc1511;padding:1px 8px;border-radius:10px">ULTIMO</span>':'')+'</div>';
      h+='<div style="display:flex;gap:10px;flex-wrap:wrap">';
      if(c.w)h+='<div><div style="font-size:9px;color:#555">Peso</div><div style="font-size:14px;font-weight:700">'+c.w+'kg</div></div>';
      if(c.bf)h+='<div><div style="font-size:9px;color:#555">% Grasa JP7</div><div style="font-size:14px;font-weight:700;color:#ef4444">'+c.bf+'%</div></div>';
      if(c.suma7)h+='<div><div style="font-size:9px;color:#555">Suma 7</div><div style="font-size:14px;font-weight:700;color:#60a5fa">'+c.suma7+'mm</div></div>';
      if(c.e)h+='<div><div style="font-size:9px;color:#555">Energia</div><div style="font-size:14px;font-weight:700">'+c.e+'/10</div></div>';
      h+='</div>';
      if(c.notes)h+='<div style="font-size:11px;color:#555;margin-top:6px">'+c.notes+'</div>';
      h+='</div>';
    });
  }
  document.getElementById('app').innerHTML=h;
}
function lbf(){
  var p=document.getElementById('cip'),ax=document.getElementById('ciax'),tri=document.getElementById('citri');
  var sub=document.getElementById('cisub'),a=document.getElementById('cia'),si=document.getElementById('cisi'),t=document.getElementById('cit');
  if(!p||!ax||!tri||!sub||!a||!si||!t)return;
  var bf=calcBF(p.value,ax.value,tri.value,sub.value,a.value,si.value,t.value);
  var vl=document.getElementById('bfv'),sm=document.getElementById('bfsum');
  if(bf&&vl){
    vl.textContent=bf+'%';
    var vals=[p,ax,tri,sub,a,si,t].map(function(el){return parseFloat(el.value)||0});
    var sum=vals.reduce(function(s,v){return s+v},0);
    if(sm)sm.textContent='suma: '+sum+'mm';
  } else {
    if(vl)vl.textContent='—';
    if(sm)sm.textContent='suma: —mm';
  }
}
function svCI(){
  var date=document.getElementById('cid').value||today();
  var w=document.getElementById('ciw').value;
  var e=document.getElementById('cie').value;
  var sl=document.getElementById('cis').value;
  var p=document.getElementById('cip').value;
  var ax=document.getElementById('ciax')?document.getElementById('ciax').value:'';
  var tri=document.getElementById('citri')?document.getElementById('citri').value:'';
  var sub=document.getElementById('cisub')?document.getElementById('cisub').value:'';
  var a=document.getElementById('cia').value;
  var si=document.getElementById('cisi')?document.getElementById('cisi').value:'';
  var t=document.getElementById('cit').value;
  var notes=document.getElementById('cin').value;
  var bf=calcBF(p,ax,tri,sub,a,si,t);
  var vals=[p,ax,tri,sub,a,si,t].map(parseFloat).filter(function(v){return !isNaN(v)&&v>0});
  var suma7=vals.length===7?vals.reduce(function(s,v){return s+v},0):null;
  D.checkins=D.checkins||[];
  D.checkins=D.checkins.filter(function(c){return c.date!==date});
  D.checkins.push({date:date,w:w,e:e,sl:sl,notes:notes,bf:bf,suma7:suma7,p7:{p:p,ax:ax,tri:tri,sub:sub,a:a,si:si,t:t},id:Date.now()});
  D.checkins.sort(function(a,b){return new Date(a.date)-new Date(b.date)});
  sv();
  var btn=document.getElementById('cisb');
  if(btn){btn.textContent='GUARDADO';btn.classList.add('ok');setTimeout(function(){btn.textContent='GUARDAR CHECK-IN';btn.classList.remove('ok');rProgress()},1500)}
}
function mChart(data,valFn,color){
  if(data.length<2)return '';
  var W=300,H=80,pad=20;
  var vals=data.map(valFn);
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=mx-mn||1;
  var pts=vals.map(function(v,i){
    return (pad+(i/(data.length-1))*(W-pad*2))+','+(H-pad-((v-mn)/rng)*(H-pad*2));
  });
  var s='<svg width="'+W+'" height="'+H+'" style="display:block;overflow:visible">';
  s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2"/>';
  vals.forEach(function(v,i){
    var xy=pts[i].split(',');
    s+='<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="3" fill="'+color+'"/>';
    s+='<text x="'+xy[0]+'" y="'+(H-4)+'" text-anchor="middle" fill="#444" font-size="8">'+data[i].date.slice(5)+'</text>';
    if(i===vals.length-1)s+='<text x="'+(parseFloat(xy[0])+5)+'" y="'+(parseFloat(xy[1])-5)+'" fill="'+color+'" font-size="10" font-weight="bold">'+v+'</text>';
  });
  s+='</svg>';
  return s;
}

function svM(){
  var date=document.getElementById('md').value||today();
  var entry={date:date,id:Date.now()};
  Object.keys(INICIO).forEach(function(k){
    var el=document.getElementById('mf-'+k);
    if(el&&el.value)entry[k]=parseFloat(el.value);
  });
  D.mlogs=D.mlogs||[];
  D.mlogs=D.mlogs.filter(function(m){return m.date!==date});
  D.mlogs.push(entry);
  D.mlogs.sort(function(a,b){return new Date(a.date)-new Date(b.date)});
  sv();
  var btn=document.getElementById('msb');
  if(btn){btn.textContent='GUARDADO';btn.classList.add('ok');setTimeout(function(){btn.textContent='GUARDAR MEDIDAS';btn.classList.remove('ok')},1500)}
}

function rShop(){
  var app=document.getElementById('app');
  var shop=D.shop||{};
  var total=SHOPLIST.filter(function(i){return i.n}).length;
  var got=Object.values(shop).filter(Boolean).length;
  var pct=Math.round(got/total*100);
  var h='<div class="stitle">LISTA DE LA COMPRA</div>';
  h+='<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:11px;color:#555">CONSEGUIDO</span><span style="font-size:11px;color:#facc15">'+got+'/'+total+'</span></div><div class="pgbg"><div class="pgfill" style="width:'+pct+'%;background:linear-gradient(90deg,#22c55e,#facc15)"></div></div></div>';
  h+='<button onclick="resetShop()" style="background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#888;padding:8px 14px;font-size:11px;cursor:pointer;font-family:inherit;margin-bottom:14px">RESETEAR LISTA</button>';
  var idx=0;
  SHOPLIST.forEach(function(item){
    if(item.sec){
      h+='<div class="shopsec">'+item.sec+'</div>';
    } else {
      var i=idx++;
      var isGot=!!shop[i];
      var isPedido=item.q.indexOf('Pedido')>=0||item.q.indexOf('Ya tienes')>=0;
      var isTemp=item.note&&item.note.indexOf('TEMPORAL')>=0;
      h+='<div class="shopitem'+(isGot?' got':'')+'" onclick="togShop('+i+')">';
      h+='<div class="shopchk'+(isGot?' ok':'')+'"><span>'+(isGot?'v':'')+'</span></div>';
      h+='<div style="flex:1">';
      h+='<div style="font-size:13px;font-weight:700;'+(isGot?'text-decoration:line-through;color:#555;':'')+'">'+(isTemp?'<span style="color:#ef4444">TEMPORAL: </span>':'')+item.n+'</div>';
      h+='<div style="font-size:11px;color:#666;margin-top:2px">'+item.q+' - '+item.d+'</div>';
      if(item.note&&!isTemp)h+='<div style="font-size:10px;color:#444;margin-top:2px">'+item.note+'</div>';
      if(item.note&&isTemp)h+='<div style="font-size:10px;color:#ef4444;margin-top:2px">'+item.note+'</div>';
      h+='</div>';
      if(isPedido)h+='<div style="font-size:9px;background:'+(item.q.indexOf('Ya tienes')>=0?'#166534':'#1e3a5f')+';color:'+(item.q.indexOf('Ya tienes')>=0?'#4ade80':'#60a5fa')+';padding:2px 6px;border-radius:4px;white-space:nowrap">'+(item.q.indexOf('Ya tienes')>=0?'TIENES':'EN CAMINO')+'</div>';
      h+='</div>';
    }
  });
  h+='<div class="tipcard"><span>Coach:</span><span>Compra para la semana entera de una vez. Ahorra tiempo y evita improvisar.</span></div>';
  
app.innerHTML=h;
}
function togShop(i){D.shop=D.shop||{};D.shop[i]=!D.shop[i];sv();rShop()}
function resetShop(){D.shop={};sv();rShop()}

function addPhoto(e,pose){
  var file=e.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var today=new Date().toISOString().split('T')[0];
    D.photos=D.photos||[];
    // Compress image
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement('canvas');
      var max=600;
      var w=img.width,h=img.height;
      if(w>h){if(w>max){h=h*(max/w);w=max;}}else{if(h>max){w=w*(max/h);h=max;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      var data=canvas.toDataURL('image/jpeg',0.7);
      D.photos.push({date:today,pose:pose,data:data,id:Date.now()});
      sv();rPhotos();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function deletePhotoDate(date){
  D.photos=(D.photos||[]).filter(function(p){return p.date!==date});
  sv();rPhotos();
}

function motSlide(i){
  var track=document.getElementById('mottrack');
  if(!track)return;
  track.style.transform='translateX(-'+(i*20)+'%)';
  for(var j=0;j<5;j++){
    var d=document.getElementById('dot'+j);
    if(d)d.style.background=i===j?'#facc15':'#555';
  }
}

var WATER_NOTIF_HOURS=[9,10,11,12,13,15,16,17,19,20];
var notifEnabled=false;
var notifIntervals=[];

function requestNotifPermission(){
  if(!('Notification' in window)){
    alert('Tu navegador no soporta notificaciones. Asegurate de tener la app instalada en pantalla de inicio.');
    return;
  }
  Notification.requestPermission().then(function(perm){
    notifEnabled=(perm==='granted');
    D.notifEnabled=notifEnabled;
    sv();
    if(notifEnabled){
      scheduleNotifs();
      showNotifStatus();
    } else {
      alert('Permiso denegado. Ve a Ajustes > Safari > Notificaciones para activarlas.');
    }
  });
}

function scheduleNotifs(){
  notifIntervals.forEach(function(i){clearInterval(i)});
  notifIntervals=[];
  // Check every minute
  var interval=setInterval(function(){
    var now=new Date();
    var h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
    if(s>5)return; // only trigger in first 5 seconds of each minute
    // Check meal notifications
    NOTIF_SCHEDULE.forEach(function(n){
      if(n.hour===h&&n.min===m){
        var restDay=D.restDays&&D.restDays[now.toISOString().split('T')[0]];
        if(restDay&&n.body.indexOf('Post-entreno')>=0)return; // skip post workout on rest day
        new Notification(n.title,{body:n.body,icon:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💪</text></svg>'});
      }
    });
    // Water reminders
    if(m===0&&WATER_NOTIF_HOURS.indexOf(h)>=0){
      var water=D.water&&D.water[now.toISOString().split('T')[0]]||0;
      if(water<3.5){
        new Notification('Luis Prep — Agua',{body:'Llevas '+water.toFixed(2)+'L. Meta: 3.5L. Bebe 250ml ahora.',icon:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💧</text></svg>'});
      }
    }
  },10000); // check every 10 seconds
  notifIntervals.push(interval);
}

function showNotifStatus(){
  var el=document.getElementById('notif-status');
  if(el){
    el.innerHTML=notifEnabled?
      '<div style="background:#0a1a0a;border:1px solid #166534;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:12px;color:#22c55e;font-weight:700">RECORDATORIOS ACTIVOS</div><div style="font-size:10px;color:#555;margin-top:2px">Comidas, agua y suplementos</div></div><button onclick="disableNotifs()" style="background:none;border:1px solid #555;border-radius:6px;color:#555;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit">Desactivar</button></div>':
      '<div style="background:#111;border:1px solid #333;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:12px;color:#888;font-weight:700">RECORDATORIOS DESACTIVADOS</div><div style="font-size:10px;color:#555;margin-top:2px">Activalos para no olvidar comer</div></div><button onclick="requestNotifPermission()" style="background:#facc15;border:none;border-radius:6px;color:#000;padding:6px 12px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:700">Activar</button></div>';
  }
}

function disableNotifs(){
  notifEnabled=false;
  D.notifEnabled=false;
  sv();
  notifIntervals.forEach(function(i){clearInterval(i)});
  notifIntervals=[];
  showNotifStatus();
}

// Init notifications on load
(function(){
  if(D.notifEnabled&&Notification.permission==='granted'){
    notifEnabled=true;
    scheduleNotifs();
  }
})();

  h+='<div style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent 50%,rgba(0,0,0,0.75) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:14px">';
  h+='<div style="font-size:10px;color:#facc15;letter-spacing:2px;margin-bottom:3px">PLANIFICACION SEMANAL</div>';
  h+='<div style="font-size:18px;font-weight:900;color:#fff">CADA SEMANA CUENTA</div>';
  h+='<div style="font-size:11px;color:#aaa;margin-top:2px">Corte hasta 1 Agosto 2026 — toca para ver</div>';
  h+='</div>';
  h+='<div style="position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.6);border:1px solid #facc1566;border-radius:6px;padding:5px 10px;font-size:11px;color:#facc15">⛶ VER</div>';
  h+='</div>';
  h+='<div class="stitle">PLANIFICACION SEMANAL</div>';
  h+='<div class="tipcard" style="margin-bottom:14px">Marca cada entreno completado. Domingos con CHECK-IN son obligatorios.</div>';
  WEEKS_DATA.forEach(function(w){
    var allDays=w.days.filter(function(d){return d.dayIdx>=0;});
    var done=allDays.filter(function(d){
      var key='w'+w.week+'d'+d.dayIdx+d.label;
      return D.weekDays&&D.weekDays[key];
    }).length;
    var pct=allDays.length>0?Math.round(done/allDays.length*100):0;
    h+='<div class="card" style="margin-bottom:12px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
    h+='<div style="font-size:13px;font-weight:900;color:#facc15">'+w.label+'</div>';
    h+='<div style="font-size:11px;color:#facc15">'+done+'/'+allDays.length+' OK</div>';
    h+='</div>';
    if(w.note)h+='<div style="font-size:11px;color:#888;margin-bottom:8px">'+w.note+'</div>';
    h+='<div class="pgbg" style="margin-bottom:10px"><div class="pgfill" style="width:'+pct+'%;background:linear-gradient(90deg,#facc15,#22c55e)"></div></div>';
    w.days.forEach(function(d){
      var key='w'+w.week+'d'+d.dayIdx+d.label;
      var isDone=D.weekDays&&D.weekDays[key];
      var isRest=d.dayIdx<0;
      var bg=isDone?'#0a1a0a':(isRest?'#0a0a0a':'#111');
      var border=isDone?'#22c55e':(isRest?'#111':'#222');
      h+='<div data-key="'+key+'" onclick="'+(isRest?'void(0)':'togWD(this.dataset.key)')+'" style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:'+bg+';border:1px solid '+border+';border-radius:8px;margin-bottom:5px;cursor:'+(isRest?'default':'pointer')+'">';
      h+='<div style="width:20px;height:20px;border-radius:50%;border:2px solid '+(isDone?'#22c55e':(isRest?'#333':'#555'))+';background:'+(isDone?'#22c55e':'transparent')+';display:flex;align-items:center;justify-content:center;font-size:11px">'+(isDone?'v':'')+'</div>';
      h+='<div style="flex:1">';
      h+='<div style="font-size:12px;font-weight:700;color:'+(isDone?'#22c55e':(isRest?'#444':'#fff'))+'">'+d.label+'</div>';
      var sublabel=isRest?(d.festivo?'Festivo - Descanso':(d.checkin?(d.fotos?'CHECK-IN + FOTOS Y MEDIDAS':'CHECK-IN SEMANAL'):'Descanso')):(WD[d.dayIdx]?WD[d.dayIdx].day+' - '+WD[d.dayIdx].short:'Entreno');
      h+='<div style="font-size:10px;color:#555">'+sublabel+'</div>';
      h+='</div></div>';
    });
    h+='</div>';
  });
  app.innerHTML=h;
}

// ── PESTAÑA RACHAS ──
function rRachas(){
  var app=document.getElementById('app');
  D.gymDays=D.gymDays||{};
  D.rachaOffset=D.rachaOffset||0;
  var now=new Date();
  var vd=new Date(now.getFullYear(),now.getMonth()+D.rachaOffset,1);
  var year=vd.getFullYear(),month=vd.getMonth();
  var mn=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var today2=now.toISOString().split('T')[0];
  var racha=0;
  var d2=new Date(now);
  while(true){
    var kk=d2.toISOString().split('T')[0];
    if(D.gymDays[kk]){racha++;d2.setDate(d2.getDate()-1);}else{break;}
  }
  var allDays=Object.keys(D.gymDays).filter(function(k){return D.gymDays[k];}).sort();
  var best=0,cur=0;
  for(var ii=0;ii<allDays.length;ii++){
    cur=(ii===0||((new Date(allDays[ii])-new Date(allDays[ii-1]))/86400000)!==1)?1:cur+1;
    if(cur>best)best=cur;
  }
  var h='';
  h+='<div style="position:relative;border-radius:12px;overflow:hidden;margin-bottom:14px;background:#000">';
  h+='<img src="'+PEDROBG+'" style="width:100%;height:320px;object-fit:contain;display:block">';
  h+='<div style="position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,0.92))">';
  h+='<div style="font-size:10px;color:#facc15;letter-spacing:2px">MOTIVACION DIARIA</div>';
  h+='<div style="font-size:16px;font-weight:900;color:#fff">CADA DIA QUE NO FALLAS</div>';
  h+='<div style="font-size:11px;color:#aaa">La estructura la tienes. El trabajo lo pone el tiempo.</div>';
  h+='</div></div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">';
  h+='<div style="background:#111;border-radius:10px;padding:12px;text-align:center"><div style="font-size:28px;font-weight:900;color:#facc15">'+racha+'</div><div style="font-size:9px;color:#555;margin-top:2px">RACHA</div></div>';
  h+='<div style="background:#111;border-radius:10px;padding:12px;text-align:center"><div style="font-size:28px;font-weight:900;color:#22c55e">'+best+'</div><div style="font-size:9px;color:#555;margin-top:2px">MEJOR</div></div>';
  h+='<div style="background:#111;border-radius:10px;padding:12px;text-align:center"><div style="font-size:28px;font-weight:900;color:#60a5fa">'+allDays.length+'</div><div style="font-size:9px;color:#555;margin-top:2px">TOTAL DIAS</div></div>';
  h+='</div>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">';
  h+='<button onclick="changeRachaMonth(-1)" style="background:#222;border:none;color:#fff;width:38px;height:38px;border-radius:8px;font-size:20px;cursor:pointer">&#8592;</button>';
  h+='<div style="font-size:15px;font-weight:900">'+mn[month]+' '+year+'</div>';
  h+='<button onclick="changeRachaMonth(1)" style="background:#222;border:none;color:#fff;width:38px;height:38px;border-radius:8px;font-size:20px;cursor:pointer">&#8594;</button>';
  h+='</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:5px">';
  ['L','M','X','J','V','S','D'].forEach(function(dn){h+='<div style="text-align:center;font-size:10px;color:#555;padding:3px">'+dn+'</div>';});
  h+='</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px">';
  var fd=new Date(year,month,1).getDay();
  var dim=new Date(year,month+1,0).getDate();
  var off=(fd===0)?6:fd-1;
  for(var jj=0;jj<off;jj++){h+='<div></div>';}
  for(var day=1;day<=dim;day++){
    var ds=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var isTdy=ds===today2;
    var isG=D.gymDays[ds];
    var isFut=ds>today2;
    var bg2=isG?'#22c55e':(isTdy?'rgba(250,204,21,0.2)':'#111');
    var col2=isG?'#000':(isTdy?'#facc15':'#555');
    var brd=isTdy?'2px solid #facc15':'1px solid #1a1a1a';
    var fw2=isG||isTdy?'900':'400';
    var cursor=isFut?'default':'pointer';
    var oc=isFut?'void(0)':'togGymDay(this.dataset.date)';
    var extra=isG?';box-shadow:0 0 8px rgba(34,197,94,0.4)':'';
    h+='<div data-date="'+ds+'" onclick="'+oc+'" style="aspect-ratio:1;background:'+bg2+';border:'+brd+';border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:'+fw2+';color:'+col2+';cursor:'+cursor+extra+'">'+day+'</div>';
  }
  h+='</div>';
  h+='<div class="tipcard">Pulsa cualquier dia pasado para marcarlo. Verde = fuiste al gym. Tu racha se calcula sola.</div>';
  app.innerHTML=h;
}
function togGymDay(dateStr){
  D.gymDays=D.gymDays||{};
  D.gymDays[dateStr]=!D.gymDays[dateStr];
  if(!D.gymDays[dateStr])delete D.gymDays[dateStr];
  sv();rRachas();
}
function changeRachaMonth(dir){
  D.rachaOffset=(D.rachaOffset||0)+dir;
  sv();rRachas();
}

async function analizarCarta(){
  var input=document.getElementById('cartaInput');
  var result=document.getElementById('cartaResult');
  if(!input||!result)return;
  var carta=input.value.trim();
  if(!carta){result.innerHTML='<span style="color:#ef4444">Escribe los platos primero.</span>';return;}
  result.innerHTML='<span style="color:#facc15">Analizando...</span>';
  try{
    var resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:500,
        system:'Eres el coach de nutricion de Luis. El esta en fase de corte: 2490kcal, 218g proteina, 318g carbos, 44g grasa. Responde SIEMPRE en español. Cuando te dan una carta o descripcion de restaurante, di exactamente que pedir: plato principal con cantidad estimada, guarnicion y como pedirlo (a la plancha, sin salsa, etc). Se breve y directo, maximo 150 palabras.',
        messages:[{role:'user',content:'Esta es la carta/restaurante: '+carta}]
      })
    });
    var data=await resp.json();
    var text=data.content&&data.content[0]&&data.content[0].text||'Sin respuesta';
    result.innerHTML=text.replace(/\n/g,'<br>');
  }catch(e){
    result.innerHTML='<span style="color:#ef4444">Error al conectar. Verifica tu conexion.</span>';
  }
}
